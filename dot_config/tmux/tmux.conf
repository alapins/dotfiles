set -g mode-keys vi
set -g mouse on
set -g default-terminal 'screen-256color'
set -g extended-keys always
set -g terminal-features 'xterm*:extkeys'
set -ag terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -ag terminal-overrides ',*:Cs=\E]12;%p1%s\007:Cr=\E]112\007'
set -g history-file ~/.local/tmux/tmux-history
set-option -g status-position top
bind m display-popup -E -w 85% -h 80% "$HOME/.local/bin/mux"  # mux popup keybinding

# Alt+hjkl focus and Alt+Ctrl+hjkl resize come from smart-splits (plugin below).
# Alt+Shift+hjkl moves the pane; vim panes get the key and swap their own windows.
unbind M-H
unbind M-J
unbind M-K
unbind M-L
bind-key -T root M-H if -F '#{@pane-is-vim}' { send-keys M-H } { swap-pane -s '{left-of}' }
bind-key -T root M-J if -F '#{@pane-is-vim}' { send-keys M-J } { swap-pane -s '{down-of}' }
bind-key -T root M-K if -F '#{@pane-is-vim}' { send-keys M-K } { swap-pane -s '{up-of}' }
bind-key -T root M-L if -F '#{@pane-is-vim}' { send-keys M-L } { swap-pane -s '{right-of}' }

# With extended keys (kitty / xterm modifyOtherKeys) tmux names Alt+Shift+letter M-S-h or
# M-S-H instead of M-H, so forward those to the M-H style bindings (-K re-dispatches the key)
bind-key -T root M-S-h send-keys -K M-H
bind-key -T root M-S-H send-keys -K M-H
bind-key -T root M-S-j send-keys -K M-J
bind-key -T root M-S-J send-keys -K M-J
bind-key -T root M-S-k send-keys -K M-K
bind-key -T root M-S-K send-keys -K M-K
bind-key -T root M-S-l send-keys -K M-L
bind-key -T root M-S-L send-keys -K M-L
bind-key -T root M-S-s send-keys -K M-S
bind-key -T root M-S-S send-keys -K M-S
bind-key -T root M-S-g send-keys -K M-G
bind-key -T root M-S-G send-keys -K M-G

# Alt+Escape in an nvim pane hands Alt+s/g/b and Alt+Shift+s/g to tmux (again: back to nvim).
# The flag is per pane and nvim clears it on start and exit (see smart-splits.lua).
bind-key -T root M-Escape if -F '#{@pane-is-vim}' { if -F '#{==:#{@tmux-owns-tabs},1}' { set -p -u @tmux-owns-tabs ; refresh-client -S } { set -p @tmux-owns-tabs 1 ; refresh-client -S } } { send-keys M-Escape }

# Alt+s / Alt+g = previous / next window (vim tab), Alt+b = new window (vim tab),
# Alt+Shift+s / Alt+Shift+g = move the pane to the previous / next window (vim tab)
unbind M-s
unbind M-g
unbind M-b
unbind M-S
unbind M-G
bind-key -T root M-s if -F '#{&&:#{@pane-is-vim},#{!=:#{@tmux-owns-tabs},1}}' { send-keys M-s } { previous-window }
bind-key -T root M-g if -F '#{&&:#{@pane-is-vim},#{!=:#{@tmux-owns-tabs},1}}' { send-keys M-g } { next-window }
bind-key -T root M-b if -F '#{&&:#{@pane-is-vim},#{!=:#{@tmux-owns-tabs},1}}' { send-keys M-b } { new-window -a -c '#{pane_current_path}' }
bind-key -T root M-S if -F '#{&&:#{@pane-is-vim},#{!=:#{@tmux-owns-tabs},1}}' { send-keys M-S } { run-shell "tmux join-pane -h -t :- && tmux select-window -t '#{pane_id}'" }
bind-key -T root M-G if -F '#{&&:#{@pane-is-vim},#{!=:#{@tmux-owns-tabs},1}}' { send-keys M-G } { run-shell "tmux join-pane -h -t :+ && tmux select-window -t '#{pane_id}'" }

# Alt-yuio and Alt-nm,. split panes
unbind M-o
unbind M-u
unbind M-y
unbind M-i
bind-key -r -T root                  M-o    split-window -h 
bind-key -r -T root                  M-u    split-window -v 
bind-key -r -T root                  M-y    split-window -hb
bind-key -r -T root                  M-i    split-window -vb

unbind M-n
unbind M-m
unbind M-,
unbind M-.
bind-key -r -T root                  M-n    split-window -hbf 
bind-key -r -T root                  M-m    split-window -vf
bind-key -r -T root                  M-,    split-window -vbf -t '{top}'
bind-key -r -T root                  M-.    split-window -hf

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'NHDaly/tmux-better-mouse-mode'
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger 'M-Space'
set -g @menus_without_prefix 'Yes'

set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @smart-splits_at_edge 'wrap'
set -g @smart-splits_resize_step_size '3'
set -g @smart-splits_move_left_key  'M-h'
set -g @smart-splits_move_down_key  'M-j'
set -g @smart-splits_move_up_key    'M-k'
set -g @smart-splits_move_right_key 'M-l'
set -g @smart-splits_resize_left_key  'M-C-h'
set -g @smart-splits_resize_down_key  'M-C-j'
set -g @smart-splits_resize_up_key    'M-C-k'
set -g @smart-splits_resize_right_key 'M-C-l'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
# marker while tmux (not nvim) owns the window/tab keys in an nvim pane
set -g status-left '[#{session_name}] #{?#{&&:#{@pane-is-vim},#{==:#{@tmux-owns-tabs},1}},#[fg=#{@thm_crust}#,bg=#{@thm_peach}#,bold] TMUX KEYS #[default] ,}'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
